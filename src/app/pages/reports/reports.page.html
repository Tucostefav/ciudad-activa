<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis reportes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @for (report of reports; track report.id) {
    <app-report-card [report]="report" [categoryName]="categoryNames[report.category_id]"></app-report-card>
  } @empty {
    <app-empty-state message="Todavía no tienes reportes."></app-empty-state>
  }
</ion-content>
