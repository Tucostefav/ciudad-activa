<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis reportes</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [value]="filter()" (ionChange)="onFilterChange($event.detail.value)">
      <ion-segment-button value="active">
        <ion-label>Activos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="closed">
        <ion-label>Cerrados</ion-label>
      </ion-segment-button>
      <ion-segment-button value="all">
        <ion-label>Todos</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (reports() === undefined) {
    <div class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else {
    @for (report of filtered(); track report.id) {
      <app-report-card
        [report]="report"
        [categoryName]="categoryNames()[report.category_id]"
        [routerLink]="['/reports', report.id]"
      ></app-report-card>
    } @empty {
      <app-empty-state message="Todavía no tienes reportes en esta lista."></app-empty-state>
    }
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/reports/new" aria-label="Nuevo reporte">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
