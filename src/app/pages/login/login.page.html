<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="brand">
    <h1>CiudadActiva</h1>
    <p>Reporta las incidencias de tu ciudad</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          errorText="Ingresa un correo válido"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          errorText="Mínimo 6 caracteres"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="loading()">
      @if (loading()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Entrar
      }
    </ion-button>
  </form>

  <p class="register">
    <ion-text color="medium">¿No tienes cuenta?</ion-text>
    <ion-button fill="clear" size="small" routerLink="/register">Crear cuenta</ion-button>
  </p>
</ion-content>
