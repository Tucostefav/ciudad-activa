<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          formControlName="full_name"
          errorText="Escribe tu nombre"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          errorText="Ingresa un correo válido"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          errorText="Mínimo 6 caracteres"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Repite la contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="confirm"
        ></ion-input>
      </ion-item>
    </ion-list>

    @if (form.hasError('mismatch') && form.controls.confirm.touched) {
      <ion-note color="danger" class="ion-padding-start">Las contraseñas no coinciden.</ion-note>
    }

    <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="loading()">
      @if (loading()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Registrarme
      }
    </ion-button>
  </form>

  <ion-note class="ion-text-center ion-margin-top" style="display: block">
    Las cuentas nuevas se crean como ciudadano.
  </ion-note>
</ion-content>
