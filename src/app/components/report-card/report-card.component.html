<ion-card>
  <ion-card-header>
    <ion-card-subtitle>{{ categoryName() || 'Sin categoría' }}</ion-card-subtitle>
    <ion-card-title>{{ report().title }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-chip [color]="statusColors[report().status]">{{ statusLabels[report().status] }}</ion-chip>
    <p class="coords">
      {{ report().latitude | number: '1.4-4' }}, {{ report().longitude | number: '1.4-4' }}
    </p>
  </ion-card-content>
</ion-card>
